name: Security Scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm ci && npm audit --audit-level=high || true
      - run: |
          echo "Scanning for hardcoded secrets..."
          ! grep -rn "AKIA[0-9A-Z]\{16\}" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" .
          ! grep -rn "BEGIN RSA PRIVATE KEY" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" .
